<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favcon.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/style.css">
  <title>Cadastro</title>
</head>
<body>

  <main>
    <h1>Formulário de Cadastro
      <span class="badge badge-info">Passo 1 de 2</span>
      <span class="badge badge-warning">Pendente</span>
    </h1>

    <div class="alert alert-warning">
      <strong>Atenção:</strong> Por favor, preencha todos os campos obrigatórios marcados com asterisco.
    </div>

    <form action="/enviar-cadastro" method="POST">
      
      <!-- Bloco 1: Identificação Pessoal -->
      <fieldset>
        <legend>Dados Pessoais
          <span class="badge badge-primary">Obrigatório</span>
        </legend>

        <div class="alert alert-info">
          Seus dados pessoais estão protegidos de acordo com a LGPD.
        </div>

        <div>
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div>
          <label for="cpf">CPF:</label>
          <input 
            type="text" 
            id="cpf" 
            name="cpf" 
            pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" 
            maxlength="14" 
            placeholder="000.000.000-00" 
            title="Digite um CPF válido no formato 000.000.000-00 ou apenas números" 
            required
          >
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input 
            type="tel" 
            id="telefone" 
            name="telefone" 
            pattern="(?:\(?\d{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}" 
            maxlength="15" 
            placeholder="(11) 98765-4321" 
            title="Digite um telefone válido com DDD (ex: 11 98765-4321)" 
            required
          >
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div>
          <label for="data_nascimento">Data de Nascimento:</label>
          <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>
      </fieldset>

      <!-- Bloco 2: Localização -->
      <fieldset>
        <legend>Endereço e Localização</legend>

        <div>
          <label for="cep">CEP:</label>
          <input 
            type="text" 
            id="cep" 
            name="cep" 
            pattern="\d{5}-?\d{3}" 
            maxlength="9" 
            placeholder="00000-000" 
            title="Digite um CEP válido no formato 00000-000 ou apenas números" 
            required
          >
        </div>

        <div>
          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, complemento" required>
        </div>

        <div>
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
        </div>

        <div>
          <label for="estado">Estado (UF):</label>
          <input type="text" id="estado" name="estado" placeholder="SP" maxlength="2" pattern="[A-Za-z]{2}" title="Insira uma sigla de estado válida com 2 letras" required>
        </div>
      </fieldset>

      <!-- Botão de Submissão -->
      <div>
        <button type="submit">Finalizar Cadastro</button>
      </div>

    </form>

  </main>
      <div class="toast">
        Sua sessão foi atualizada com sucesso!
    </div>

    <footer>
        <p>©2026 ONG Renovar</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
